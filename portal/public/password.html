<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{LABEL}}</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0f13;color:#e6e9ee;font:14px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.c{background:#161a21;border:1px solid #2a303a;border-radius:10px;padding:22px;width:min(340px,92vw);display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:15px;font-weight:600}input,button{font:inherit;border-radius:6px;padding:9px 12px;border:1px solid #2a303a;background:#1d222b;color:inherit}
button{background:#ffb938;border-color:#ffb938;color:#1a1205;font-weight:600;cursor:pointer}.e{color:#ff5b50;min-height:1.2em;font-size:13px}p{margin:0;color:#8b93a0}</style></head><body>
<div class="c"><h1>{{LABEL}}</h1><p>Enter the password you were given.</p><input id="p" type="password" autofocus><button id="b">Watch</button><div class="e" id="e"></div></div>
<script>
const p = document.getElementById('p'), b = document.getElementById('b'), e = document.getElementById('e')
async function go() {
  const r = await fetch('/w/{{ID}}/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: p.value }) })
  if (r.ok) location.reload(); else e.textContent = (await r.json().catch(() => ({}))).error || 'Wrong password'
}
b.onclick = go; p.addEventListener('keydown', ev => ev.key === 'Enter' && go())
</script></body></html>
