<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena Portal</title>
<style>
:root{--bg:#0d0f13;--panel:#161a21;--edge:#2a303a;--text:#e6e9ee;--mut:#8b93a0;--acc:#ffb938;--ok:#34d058;--bad:#ff5b50}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--edge)}
h1{font-size:15px;letter-spacing:.14em;margin:0;font-weight:600;text-transform:uppercase}
nav{display:flex;gap:6px;margin-left:12px}nav button{background:none;border:1px solid var(--edge);color:var(--mut);padding:6px 14px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);border-color:var(--acc);color:#1a1205;font-weight:600}
.sp{flex:1}main{padding:20px;max-width:1100px;margin:0 auto;overflow-x:auto}table{min-width:620px}header{flex-wrap:wrap}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--edge);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--edge);vertical-align:middle}th{color:var(--mut);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
button.b,select,input{background:#1d222b;border:1px solid var(--edge);color:var(--text);border-radius:6px;padding:6px 12px;font:inherit}
button.b{cursor:pointer}button.b:hover{border-color:var(--acc)}button.b.pri{background:var(--acc);border-color:var(--acc);color:#1a1205;font-weight:600}
button.b:disabled{opacity:.45;cursor:default}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#232832;color:var(--mut)}
.chip.ok{background:rgba(52,208,88,.15);color:var(--ok)}.chip.bad{background:rgba(255,91,80,.15);color:var(--bad)}.chip.warn{background:rgba(255,185,56,.15);color:var(--acc)}
.empty{color:var(--mut);padding:24px;text-align:center}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:20px;max-width:340px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:5}
.modal .card{margin:0;max-width:440px;width:92vw}label{display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.url{flex:1;font-family:Consolas,monospace;font-size:12px}
.thumb{width:128px;height:72px;object-fit:cover;background:#0b0d10;border:1px solid var(--edge);border-radius:4px;display:block;cursor:pointer}
.nothumb{width:128px;height:72px;border:1px dashed var(--edge);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;cursor:pointer}
.live video{width:100%;aspect-ratio:16/9;background:#000;border-radius:6px}.live{max-width:760px!important;width:94vw!important}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{background:#0e1013;border:1px solid var(--edge);border-radius:6px;padding:8px 10px;min-width:0}
.tlabel{font-size:10px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.tvalue{font-family:Consolas,monospace;color:var(--acc);margin-top:2px;white-space:nowrap}
.tile.ok .tvalue{color:var(--ok)}.tile.bad .tvalue{color:var(--bad)}
.chead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,#1c222c,#151921);border:1px solid var(--edge);border-radius:12px;padding:14px 18px;margin-bottom:14px}
.ctitle{font-size:18px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(52,208,88,.16);flex:none}.dot.down{background:var(--bad);box-shadow:0 0 0 4px rgba(255,91,80,.16)}
button.b.ghost{background:none;color:var(--mut)}button.b.ghost:hover{color:var(--text)}button.b.ghost.danger:hover{color:var(--bad);border-color:var(--bad)}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--edge);margin-bottom:16px;flex-wrap:wrap}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:9px 16px;font:inherit;cursor:pointer;margin-bottom:-1px;white-space:nowrap}.subtabs button:hover{color:var(--text)}.subtabs button.on{color:var(--text);font-weight:600;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px 16px}.stat b{display:block;font-size:30px;font-weight:600;line-height:1.1}.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.stat.up b{color:var(--ok)}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:16px 18px}.panel h2{margin-bottom:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--edge);flex-wrap:wrap}.li:last-child{border-bottom:0}
.grow{flex:1;min-width:120px}.nm{font-weight:600}
.av{width:38px;height:38px;border-radius:50%;background:#262c37;color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none;position:relative}
.av.on{background:rgba(52,208,88,.15);color:var(--ok)}.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.chn{width:28px;height:28px;border-radius:8px;background:#232832;color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.gwline{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;display:inline-flex;flex-direction:row;cursor:pointer;color:inherit;font-size:12px}.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{padding:4px 12px;border-radius:999px;border:1px solid var(--edge);color:var(--mut);background:#1b2028;user-select:none;transition:background .12s,color .12s}
.pill:hover span{border-color:var(--acc)}.pill input:checked+span{background:rgba(255,185,56,.16);border-color:var(--acc);color:var(--acc);font-weight:600}
.pill.warn:hover span{border-color:var(--bad)}.pill.warn input:checked+span{background:rgba(255,91,80,.15);border-color:var(--bad);color:var(--bad)}
.pill input:focus-visible+span{outline:2px solid var(--acc);outline-offset:1px}
.gc{display:flex;flex-direction:column;gap:10px}.gc .ch{display:flex;align-items:center;gap:10px}
.prow.off .nm,.prow.off .av{opacity:.5}
.err{color:var(--bad);font-size:13px;min-height:1.2em}.hint{color:var(--mut);font-size:12px}h2{margin:0 0 10px;font-size:13px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;font-weight:600}
</style></head><body>
<div id="app"></div>
<script>
const $app = document.getElementById('app')
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v)
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)))
  return n
}
async function api(path, method = 'GET', body) {
  const r = await fetch('/portal/api' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
  const j = await r.json().catch(() => ({}))
  if (r.status === 401 && path !== '/login') { showLogin(); throw new Error('signed out') }
  if (!r.ok) throw new Error(j.error || r.statusText)
  return j
}
const fmtTime = t => t ? new Date(t).toLocaleString() : 'never'
let publicBase = '', me = {}
const linkUrl = id => (publicBase || location.origin) + '/w/' + id
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text) } catch { const t = el('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove() }
  const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => (btn.textContent = o), 1200)
}

let thumbTimer = null
let tab = 'streams', timer = null, streams = [], links = [], decoders = []

function showLogin() {
  clearInterval(timer); clearInterval(thumbTimer); clearInterval(ownerTimer); clearInterval(healthTimer); clearInterval(capTimer); clearInterval(commsTimer); tab = 'streams'
  const err = el('div', { class: 'err' })
  const user = el('input', { type: 'text', placeholder: 'Username', autocomplete: 'username', autofocus: true })
  const pw = el('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password' })
  const go = async () => { try { await api('/login', 'POST', { username: user.value, password: pw.value }); const m = await api('/me'); publicBase = m.publicBase || ''; me = m; start() } catch (e) { err.textContent = e.message } }
  pw.addEventListener('keydown', e => e.key === 'Enter' && go()); user.addEventListener('keydown', e => e.key === 'Enter' && pw.focus())
  $app.replaceChildren(el('div', { class: 'card' }, el('h1', {}, 'Arena Portal'), user, pw, el('button', { class: 'b pri', onclick: go }, 'Sign in'), err,
    el('div', { class: 'hint' }, 'Leave the username empty to use the shared portal password.')))
  user.focus()
}

// Four sections. Video holds Streams, Web links and Decoders as a second row; the others are one page each.
const VIDEO_TABS = [['streams', 'Streams'], ['links', 'Web links'], ['decoders', 'Decoders']]
const isVideo = t => VIDEO_TABS.some(v => v[0] === t)
let lastVideoTab = 'streams'
function stopSectionTimers() { clearInterval(ownerTimer); clearInterval(healthTimer); clearInterval(capTimer); clearInterval(commsTimer) }
function shell(content) {
  const sections = [['video', 'Video'], ['comms', 'Comms'], ['remote', 'Remote access'], ['admin', 'Admin']]
  const cur = isVideo(tab) ? 'video' : tab
  const go = k => { tab = k === 'video' ? lastVideoTab : k; stopSectionTimers(); refresh() }
  const subnav = isVideo(tab) ? el('div', { class: 'row', style: 'margin-bottom:14px' }, VIDEO_TABS.map(([k, t]) => el('button', { class: 'b' + (tab === k ? ' pri' : ''), onclick: () => { tab = lastVideoTab = k; refresh() } }, t))) : null
  content = [].concat(subnav ? [subnav] : [], content)
  return [
    el('header', {}, el('h1', {}, 'Arena Portal'),
      el('nav', {}, sections.map(([k, t]) => el('button', { class: cur === k ? 'on' : '', onclick: () => go(k) }, t))),
      el('div', { class: 'sp' }), me.user ? el('button', { class: 'b', title: 'Signed in as ' + me.user + '. Click to edit your name and email.', onclick: myProfile }, me.name || me.user) : null,
      el('button', { class: 'b', onclick: async () => { await api('/logout', 'POST'); showLogin() } }, 'Sign out')),
    el('main', {}, ...content),
  ]
}

// Thumbnails: a picture per stream, fetched every few seconds while this page is open (the server only
// runs the picture worker while it is asked). Kept as object URLs so a redraw does not reload them.
const thumbCache = {}
function thumbEl(s) {
  const url = thumbCache[s.id]
  const open = () => liveDialog(s)
  if (!s.canShare || !s.browserOk) return el('div', { class: 'hint' }, '-')
  return url ? el('img', { class: 'thumb', src: url, 'data-sid': s.id, title: 'Click for live video', onclick: open })
             : el('div', { class: 'nothumb', 'data-sid': s.id, title: 'Click for live video', onclick: open }, 'waiting...')
}
async function fetchThumbs() {
  if (document.hidden || document.querySelector('.modal') || tab === 'links') return
  let changed = false
  await Promise.all(streams.filter(s => s.canShare && s.browserOk).map(async s => {
    try {
      const r = await fetch('/portal/api/thumb/' + encodeURIComponent(s.id))
      if (r.status !== 200) return
      const u = URL.createObjectURL(await r.blob())
      if (thumbCache[s.id]) URL.revokeObjectURL(thumbCache[s.id])
      thumbCache[s.id] = u; changed = true
    } catch (e) { /* try again next round */ }
  }))
  if (changed) for (const n of document.querySelectorAll('.nothumb')) { const s = streams.find(x => x.id === n.dataset.sid); if (s && thumbCache[s.id]) n.replaceWith(thumbEl(s)) }
  if (changed) for (const i of document.querySelectorAll('img.thumb')) if (thumbCache[i.dataset.sid] && i.src !== thumbCache[i.dataset.sid]) i.src = thumbCache[i.dataset.sid]
}

async function playWhep(base, video, say) {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] })
  let session = null, closed = false
  pc.addTransceiver('video', { direction: 'recvonly' }); pc.addTransceiver('audio', { direction: 'recvonly' })
  pc.ontrack = e => { video.srcObject = e.streams[0] }
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'connected') say(''); if (pc.connectionState === 'failed' && !closed) say('Connection lost') }
  try {
    await pc.setLocalDescription(await pc.createOffer())
    await new Promise(r => { if (pc.iceGatheringState === 'complete') return r(); pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r(); setTimeout(r, 2500) })
    const r = await fetch(base, { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp })
    if (r.status !== 201) throw new Error((await r.json().catch(() => ({}))).error || 'not available')
    session = r.headers.get('Location')
    await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() })
  } catch (e) { say(e.message) }
  return () => { closed = true; if (session) fetch(session, { method: 'DELETE' }).catch(() => {}); try { pc.close() } catch (e) { /* closed */ } }
}

function liveDialog(s) {
  const video = el('video', { autoplay: true, playsinline: true, muted: true, controls: true })
  video.muted = true
  const msg = el('div', { class: 'hint' }, 'Connecting...')
  let stop = () => {}
  const close = () => { stop(); dlg.remove() }
  const dlg = el('div', { class: 'modal', onclick: e => e.target === dlg && close() }, el('div', { class: 'card live' },
    el('h2', {}, 'Live: ' + s.name + '  ' + (s.format || '')), video, msg,
    el('div', { class: 'row' }, el('button', { class: 'b', onclick: close }, 'Close'), el('span', { class: 'hint' }, 'Sends the full stream to this browser; close it when you are done.'))))
  document.body.append(dlg)
  playWhep('/portal/api/whep/' + encodeURIComponent(s.id), video, t => { msg.textContent = t })
    .then(f => { if (!dlg.isConnected) f(); else stop = f })
}

function streamsView() {
  if (!streams.length) return el('div', { class: 'empty' }, 'No encoders are on air.')
  return el('table', {}, el('thead', {}, el('tr', {}, ['', 'Stream', 'Format', 'Codec', 'Bitrate', 'Web viewers', 'Links', ''].map(h => el('th', {}, h)))),
    el('tbody', {}, streams.map(s => el('tr', {},
      el('td', {}, thumbEl(s)), el('td', {}, s.name), el('td', {}, s.format || '-'), el('td', {}, s.codec || '-'),
      el('td', {}, s.kbps ? (s.kbps / 1000).toFixed(1) + ' Mbps' : '-'),
      el('td', {}, String(s.webViewers)), el('td', {}, String(s.links)),
      el('td', {}, !s.canShare ? el('span', { class: 'chip warn', title: 'Turn on "Internet viewers" for this stream in the Arena Link app' }, 'Not on relay')
        : !s.browserOk ? el('span', { class: 'chip warn', title: 'Browsers cannot play H.265. Use H.264 in the encoder.' }, 'H.265: no browser')
        : el('button', { class: 'b pri', onclick: () => newLinkDialog(s.name) }, 'Create web link'))))))
}

function linksView() {
  if (!links.length) return el('div', { class: 'empty' }, 'No links yet. Create one from the Streams tab.')
  return el('table', {}, el('thead', {}, el('tr', {}, ['Link', 'Stream', 'Status', 'Expires', 'Views', ''].map(h => el('th', {}, h)))),
    el('tbody', {}, links.map(l => {
      const cls = l.state === 'active' ? 'ok' : 'bad'
      return el('tr', {},
        el('td', {}, l.label || '(no label)', l.hasPassword ? el('span', { class: 'hint' }, '  password') : null),
        el('td', {}, l.stream), el('td', {}, el('span', { class: 'chip ' + cls }, l.state)), el('td', {}, fmtTime(l.expiresAt)), el('td', {}, String(l.views)),
        el('td', {}, l.state === 'active' ? el('div', { class: 'row' },
          el('button', { class: 'b', onclick: e => copy(linkUrl(l.id), e.target) }, 'Copy link'),
          el('button', { class: 'b', onclick: async () => { if (confirm('Revoke this link? Anyone using it is cut off.')) { await api('/links/' + l.id, 'DELETE'); refresh() } } }, 'Revoke')) : null))
    })))
}

const dChoice = {}
function decodersView() {
  if (!decoders.length) return el('div', { class: 'empty' }, 'No decoders are reporting. Open the Arena Link app on a decoder PC (update it to this version first).')
  const live = streams.map(s => s.name)
  return el('table', {}, el('thead', {}, el('tr', {}, ['Decoder', 'PC', 'Status', 'Playing', '', 'Play this stream', ''].map(h => el('th', {}, h)))),
    el('tbody', {}, decoders.map(d => {
      const sel = el('select', {}, el('option', { value: '' }, 'Disconnect'),
        [...new Set([...live, d.stream].filter(Boolean))].map(n => el('option', { value: n, selected: (dChoice[d.id] ?? d.stream) === n }, n)))
      sel.addEventListener('change', () => { dChoice[d.id] = sel.value })
      if (dChoice[d.id] === undefined && !d.stream) sel.value = ''
      const pending = d.want && d.want.stream !== d.stream
      return el('tr', {},
        el('td', {}, d.name), el('td', {}, d.host || '-'),
        el('td', {}, el('span', { class: 'chip ' + (d.state === 'live' ? 'ok' : '') }, d.state || '-')),
        el('td', {}, d.stream || '-'),
        el('td', {}, (() => { const st = streams.find(x => x.name === d.stream); return st ? thumbEl(st) : el('div', { class: 'hint' }, '-') })()),
        el('td', {}, sel),
        el('td', {}, el('div', { class: 'row' }, el('button', { class: 'b pri', onclick: async () => { await api('/decoders/' + encodeURIComponent(d.id) + '/want', 'POST', { stream: sel.value }); delete dChoice[d.id]; refresh() } }, 'Apply'),
          pending ? el('span', { class: 'chip warn' }, 'waiting for decoder') : null)))
    })))
}

function newLinkDialog(stream) {
  const label = el('input', { type: 'text', placeholder: 'For example: Client preview' })
  const exp = el('select', {}, [['60', '1 hour'], ['240', '4 hours'], ['1440', '1 day'], ['10080', '7 days'], ['43200', '30 days'], ['0', 'No expiry']].map(([v, t], i) => el('option', { value: v, selected: i === 2 }, t)))
  const pw = el('input', { type: 'text', placeholder: 'Optional password', autocomplete: 'off' })
  const err = el('div', { class: 'err' })
  const out = el('div')
  const close = () => dlg.remove()
  const make = async () => {
    err.textContent = ''
    try {
      const { link } = await api('/links', 'POST', { stream, label: label.value, expiresInMin: Number(exp.value), password: pw.value })
      const url = el('input', { type: 'text', class: 'url', readonly: true, value: linkUrl(link.id) })
      const cb = el('button', { class: 'b pri', onclick: e => copy(url.value, e.target) }, 'Copy')
      out.replaceChildren(el('div', { class: 'row' }, url, cb), el('div', { class: 'hint' }, 'Send this to the viewer. It works in any browser.'))
      refresh()
    } catch (e) { err.textContent = e.message }
  }
  const dlg = el('div', { class: 'modal', onclick: e => e.target === dlg && close() }, el('div', { class: 'card' },
    el('h2', {}, 'New web link: ' + stream),
    el('label', {}, 'Label', label), el('label', {}, 'Expires', exp), el('label', {}, 'Password', pw), err, out,
    el('div', { class: 'row' }, el('button', { class: 'b pri', onclick: make }, 'Create link'), el('button', { class: 'b', onclick: close }, 'Close'))))
  document.body.append(dlg)
  label.focus()
}

// ── Admin (owner-only) ─────────────────────────────────────────────────────────
// Needs the owner password on top of the normal login; it locks again after 15 idle minutes.
let owner = { configured: true, unlocked: false, remainingSec: 0 }, adminSub = 'account', ownerTimer = null, healthTimer = null
const SUBS = [['account', 'Account and security'], ['settings', 'Settings'], ['health', 'Server health'], ['capacity', 'Capacity test'], ['activity', 'Activity and links']]

async function oapi(path, method = 'GET', body) {
  const r = await fetch('/portal/api/owner' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
  const j = await r.json().catch(() => ({}))
  if (r.status === 401 && path !== '/login') { showLogin(); throw new Error('signed out') }
  if (r.status === 403 && j.locked) { owner.unlocked = false; ownerAreaRender(); throw new Error('locked') }
  if (!r.ok) throw new Error(j.error || r.statusText)
  return j
}
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
const bytes = n => n >= 1e12 ? (n / 1e12).toFixed(1) + ' TB' : n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : (n / 1e6).toFixed(0) + ' MB'
const fmtAgo = s => s >= 86400 ? Math.floor(s / 86400) + ' d ' + Math.floor(s % 86400 / 3600) + ' h' : s >= 3600 ? Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min' : Math.floor(s / 60) + ' min'

function msgBox() { return el('div', { class: 'err' }) }
function flash(box, text, good) { box.textContent = text; box.style.color = good ? 'var(--ok)' : 'var(--bad)' }

async function adminRender() {
  clearInterval(ownerTimer); clearInterval(healthTimer); clearInterval(capTimer); clearInterval(commsTimer)
  try { owner = await oapi('/status') } catch (e) { if (e.message === 'signed out') return }
  const body = $app.querySelector('main')
  if (!body) return $app.replaceChildren(...shell(el('div')))
  if (!owner.unlocked) return body.replaceChildren(lockCard())
  const content = el('div')
  body.replaceChildren(
    el('div', { class: 'row', style: 'margin-bottom:14px;flex-wrap:wrap' },
      SUBS.map(([k, t]) => el('button', { class: 'b' + (adminSub === k ? ' pri' : ''), onclick: () => { adminSub = k; adminRender() } }, t)),
      el('div', { class: 'sp' }),
      owner.viaAccount ? el('span', { class: 'hint' }, 'Signed in as an admin account') : el('span', { class: 'hint', id: 'ownerLeft' }, 'Owner unlocked, locks in ' + mmss(owner.remainingSec)),

      el('div', { class: 'sp' }), el('button', { class: 'b ghost', onclick: async () => { if (confirm('Disconnect the portal from Comms? Nothing is deleted on the Comms server.')) { await oapi('/comms/disconnect', 'POST'); refresh() } } }, 'Disconnect')),
    err, tabsBar, live)

  let st = null, portalUsers = [], busy = false
  const TABS = [['overview', 'Overview'], ['groups', 'Groups'], ['people', 'People'], ['accounts', 'Portal accounts']]

  const paint = () => {
    if (!st) return
    const chName = id => (st.channels.find(c => c.id === id) || {}).name || id
    const musicCh = new Set(st.channels.filter(c => c.music || c.withMusic).map(c => c.id))
    const onlineIds = new Set(st.online.map(o => o.userId || o.id))
    tabsBar.replaceChildren(...TABS.map(([k, t]) => el('button', { class: commsTab === k ? 'on' : '', onclick: () => { commsTab = k; paint() } }, t)))
    const empty = t => el('div', { class: 'hint', style: 'padding:8px 0' }, t)

    // ── Overview: numbers, who is online, and who can use which channel
    const overview = () => {
      const stat = (n, label, cls) => el('div', { class: 'stat ' + (cls || '') }, el('b', {}, String(n)), el('span', {}, label))
      const kick = o => el('button', { class: 'b ghost', onclick: async () => { if (!confirm('Disconnect ' + (o.name || o.id) + ' from the intercom? They can rejoin.')) return; try { await oapi('/comms/kick/' + encodeURIComponent(o.id), 'POST'); await load() } catch (e) { flash(err, e.message) } } }, 'Kick')
      const onlineList = el('div', { class: 'panel' }, el('h2', {}, 'Online now'),
        st.online.length ? st.online.map(o => el('div', { class: 'li' }, avatar(o.name || o.username || o.id, true), el('div', { class: 'grow' }, el('div', { class: 'nm' }, o.name || o.username || o.id, o.gateway ? el('span', { class: 'chip', style: 'margin-left:8px' }, 'gateway') : null), el('div', { class: 'hint', style: 'margin:0' }, o.gateway ? (o.channels && o.channels.length ? 'Carries ' + o.channels.map(chName).join(', ') : 'Not carrying any channel') : (o.title || 'No role set'))), kick(o))) : empty('Nobody is connected.'))
      const channelList = el('div', { class: 'panel' }, el('h2', {}, 'Channels'),
        st.channels.length ? st.channels.map(c => {
          const who = st.groups.filter(g => g.grants && g.grants[c.id] && (g.grants[c.id].talk || g.grants[c.id].listen || g.grants[c.id].music))
          const gws = st.online.filter(o => o.gateway && (o.channels || []).includes(c.id))
          return el('div', { class: 'li' }, el('span', { class: 'chn' }, musicCh.has(c.id) ? '♪' : '#'), el('div', { class: 'grow' }, el('div', { class: 'nm' }, c.name, musicCh.has(c.id) ? el('span', { class: 'chip', style: 'margin-left:8px' }, 'music') : null),
            el('div', { class: 'gwline' }, gws.length ? gws.map(g => el('span', { class: 'chip ok' }, '⇄ ' + g.name)) : el('span', { class: 'hint', style: 'margin:0' }, 'no gateway'))),
            el('div', { class: 'pills', style: 'justify-content:flex-end' }, who.length ? who.map(g => el('span', { class: 'chip' }, g.name)) : el('span', { class: 'hint' }, 'no group yet')))
        }) : empty('The Comms server has no channels.'))
      return el('div', {}, el('div', { class: 'stats' }, stat(st.online.length, 'Online now', 'up'), stat(st.users.length, 'People'), stat(st.groups.length, 'Groups'), stat(st.channels.length, 'Channels')),
        el('div', { class: 'two' }, onlineList, channelList))
    }

    // ── Groups: which channels each group may talk on, listen to, or play music on
    const groupCard = g => {
      const grants = JSON.parse(JSON.stringify(g.grants || {}))
      const name = el('input', { type: 'text', value: g.name, style: 'width:100%' })
      const members = st.users.filter(u => (u.groups || []).includes(g.id)).length
      const self = pill(g.selfJoin, 'People can join this group themselves', v => { g.selfJoin = v })
      const perm = (ch, k, label) => pill(grants[ch] && grants[ch][k], label, v => { (grants[ch] = grants[ch] || {})[k] = v })
      const save = async () => { busy = true; try { await oapi('/comms/groups/' + encodeURIComponent(g.id), 'PUT', { name: name.value, selfJoin: !!g.selfJoin, grants }); flash(err, 'Saved ' + name.value + '.', true) } catch (e) { flash(err, e.message) } busy = false; load() }
      return el('div', { class: 'panel gc' },
        el('div', { class: 'ch' }, el('div', { class: 'grow' }, name), el('span', { class: 'chip' }, plural(members, 'member'))),
        el('div', {}, self),
        el('div', {}, st.channels.map(c => el('div', { class: 'li', style: 'padding:7px 0' }, el('span', { class: 'chn' }, musicCh.has(c.id) ? '♪' : '#'), el('div', { class: 'grow nm', style: 'font-weight:500' }, c.name),
          el('div', { class: 'pills' }, perm(c.id, 'talk', 'Talk'), perm(c.id, 'listen', 'Listen'), musicCh.has(c.id) ? perm(c.id, 'music', 'Music') : null)))),
        el('div', { class: 'row' }, el('button', { class: 'b pri', onclick: save }, 'Save group'), el('div', { class: 'sp' }),
          el('button', { class: 'b ghost danger', onclick: async () => { if (!confirm('Delete the group ' + g.name + '? Members lose what it gave them.')) return; try { await oapi('/comms/groups/' + encodeURIComponent(g.id), 'DELETE'); await load() } catch (e) { flash(err, e.message) } } }, 'Delete')))
    }
    const groupsView = () => {
      const newName = el('input', { type: 'text', placeholder: 'New group name', style: 'flex:1' })
      const add = async () => { try { await oapi('/comms/groups', 'POST', { name: newName.value, grants: {} }); await load() } catch (e) { flash(err, e.message) } }
      return el('div', {}, el('div', { class: 'hint', style: 'margin:0 0 12px' }, 'A group says which channels its members may talk on, listen to, or start music on. People get permissions through the groups they are in.'),
        el('div', { class: 'panel row', style: 'margin-bottom:14px' }, newName, el('button', { class: 'b pri', onclick: add }, 'Add group')),
        st.groups.length ? el('div', { class: 'two' }, st.groups.map(groupCard)) : empty('No groups yet. Add one above.'))
    }

    // ── People: group membership as pills, saved as you click
    const personRow = u => {
      const sel = new Set(u.groups || [])
      const put = async (body, msg) => { try { await oapi('/comms/users/' + encodeURIComponent(u.id), 'PUT', body); flash(err, msg, true) } catch (e) { flash(err, e.message); load() } }
      const gp = st.groups.map(g => pill(sel.has(g.id), g.name, v => { v ? sel.add(g.id) : sel.delete(g.id); put({ groups: [...sel] }, 'Saved ' + u.username + '.') }))
      const link = st.links[u.id]
      return el('div', { class: 'li prow' + (u.disabled ? ' off' : '') }, avatar(u.name || u.username, onlineIds.has(u.id)),
        el('div', { class: 'grow' }, el('div', { class: 'nm' }, u.name && u.name !== u.username ? u.name : u.username,
          onlineIds.has(u.id) ? el('span', { class: 'chip ok', style: 'margin-left:8px' }, 'online') : null, u.admin ? el('span', { class: 'chip', style: 'margin-left:6px' }, 'Comms admin') : null),
          el('div', { class: 'hint', style: 'margin:0' }, u.username + '  ·  ' + (link ? 'portal account: ' + link : 'not linked to a portal account'))),
        el('div', { class: 'pills', style: 'flex:2;justify-content:flex-end' }, st.groups.length ? gp : el('span', { class: 'hint' }, 'no groups yet')),
        pill(u.disabled, 'Disabled', v => put({ disabled: v }, (v ? 'Disabled ' : 'Enabled ') + u.username + '.'), 'warn'))
    }
    const peopleView = () => el('div', { class: 'panel' }, el('h2', {}, plural(st.users.length, 'person').replace('persons', 'people')),
      el('div', { class: 'hint', style: 'margin:0 0 6px' }, 'Click a group to add or remove someone. It saves straight away and applies to people who are connected right now.'),
      st.users.length ? st.users.map(personRow) : empty('No Comms users.'))

    // ── Portal accounts that have (or could have) a Comms login
    const accountsView = () => el('div', { class: 'panel' }, el('h2', {}, 'Portal accounts and Comms logins'),
      el('div', { class: 'hint', style: 'margin:0 0 6px' }, 'Link a portal account to a Comms login with the same username, name and password, so one place manages both. Unlinking only disables the Comms login.'),
      portalUsers.length ? portalUsers.map(u => el('div', { class: 'li' }, avatar(u.name || u.username, false), el('div', { class: 'grow' }, el('div', { class: 'nm' }, u.username), u.name ? el('div', { class: 'hint', style: 'margin:0' }, u.name) : null),
        u.commsLinked ? el('span', { class: 'chip ok' }, 'linked') : el('span', { class: 'chip' }, 'not linked'),
        el('button', { class: 'b', onclick: () => commsDialog(u, load) }, u.commsLinked ? 'Edit link' : 'Give a Comms login'))) : empty('No portal accounts yet. Portal accounts are created in Admin.'))

    live.replaceChildren(({ overview, groups: groupsView, people: peopleView, accounts: accountsView })[commsTab]())
  }

  const load = async () => {
    if (busy) return
    try { st = await oapi('/comms/state'); portalUsers = (await oapi('/users')).users; dot.className = 'dot' }
    catch (e) {
      if (e.message === 'locked' || e.message === 'signed out') throw e
      dot.className = 'dot down'
      live.replaceChildren(el('div', { class: 'panel' }, el('div', { class: 'err' }, e.message), el('div', { class: 'hint' }, 'The portal cannot reach the Comms server right now. It will keep trying.')))
      return
    }
    paint()
  }
  await load()
  commsTimer = setInterval(() => { if (tab === 'comms' && !document.hidden && !document.querySelector('.modal') && !document.activeElement?.matches?.('input[type=text],input[type=password]')) load().catch(() => {}) }, 5000)
}

// ── Capacity test ───────────────────────────────────────────────────────────────
// Runs on the server (portal/captest.js): synthetic 10 Mbps streams are published to the relay and read back
// the way decoders and browsers would, while CPU, memory, network and per-process load are sampled.
let capTimer = null
async function capacitySection(box) {
  const ph = n => el('span', { class: 'hint', style: 'margin:0' }, n)
  const num = (v, w = 70) => el('input', { type: 'text', value: String(v), style: 'width:' + w + 'px' })
  const maxS = num(20), step = num(2), stepSec = num(40), srt = num(1), rtsp = num(1), whep = num(1), cpuStop = num(90)
  const allowLive = el('input', { type: 'checkbox' }), ack = el('input', { type: 'checkbox' })
  const err = msgBox()
  const live = el('div'), results = el('div')

  const tile = (label, value, cls) => el('div', { class: 'tile ' + (cls || '') }, el('div', { class: 'tlabel' }, label), el('div', { class: 'tvalue', style: 'font-size:18px' }, value))
  const stepTable = steps => el('table', { style: 'min-width:0' }, el('thead', {}, el('tr', {}, ['Streams', 'Readers', 'Server CPU', 'Generator CPU', 'Peak CPU', 'Load', 'Slowest reader', 'Net in / out', 'Busiest processes', ''].map(h => el('th', {}, h)))),
    el('tbody', {}, steps.map(s => el('tr', {},
      el('td', {}, String(s.streams)), el('td', {}, String(s.readers)), el('td', {}, s.serverCpu + '%'), el('td', { class: 'hint' }, s.generatorCpu + '%'), el('td', {}, s.cpuMax + '%'), el('td', {}, s.load1Max.toFixed(2)),
      el('td', {}, s.readerMbpsMin + ' Mbps'), el('td', {}, s.netRxMbps + ' / ' + s.netTxMbps + ' Mbps'), el('td', { class: 'hint' }, (s.top || []).map(t => t[0] + ' ' + t[1] + '%').join(', ')),
      el('td', {}, el('span', { class: 'chip ' + (s.verdict === 'clean' ? 'ok' : 'bad') }, s.verdict))))))

  const draw = async () => {
    const st = await oapi('/captest')
    const s = st.status
    live.replaceChildren()
    if (st.running || st.starting) {
      const n = s && s.now
      live.append(el('div', { class: 'card', style: 'margin:0;max-width:none' },
        el('h2', {}, st.starting && !s ? 'Starting (the server is launching the test)...' : 'Running: ' + (s.phase === 'preparing' ? 'making the 10 Mbps sample' : s.phase === 'checking' ? 'checking that one stream goes through the relay and back' : 'step ' + (s.step || '') + ' of up to ' + s.cfg.streamsMax + ' streams, ' + (n ? n.phase : ''))),
        n ? el('div', { class: 'tiles' }, tile('Streams', String(n.streams)), tile('Server CPU', n.serverCpu + '%', n.serverCpu > 70 ? 'warn' : 'ok'), tile('Generator CPU', n.generatorCpu + '%'), tile('All CPU', n.cpu + '%', n.cpu > 85 ? 'bad' : ''),
          tile('Load (1 min)', n.load1.toFixed(2)), tile('Free memory', n.memAvailGB + ' GB'), tile('Network in', n.netRxMbps + ' Mbps'), tile('Network out', n.netTxMbps + ' Mbps')) : null,
        s && s.steps && s.steps.length ? stepTable(s.steps) : null,
        el('div', { class: 'row' }, el('button', { class: 'b', onclick: async () => { try { await oapi('/captest/stop', 'POST') } catch (e) { flash(err, e.message) } } }, 'Stop the test'), el('span', { class: 'hint' }, 'It also stops by itself if CPU stays high, memory runs low, readers fall behind, or a live stream is affected.'))))
    }
    results.replaceChildren()
    if (st.stalled && s) results.append(el('div', { class: 'card', style: 'margin:0 0 14px;max-width:none' }, el('h2', {}, 'The last test stopped without finishing'),
      el('div', { class: 'hint', style: 'margin:0 0 8px' }, 'It was at "' + (s.phase || '?') + '"' + (s.step ? ', step ' + s.step : '') + ' when it stopped reporting. What it measured before that:'),
      s.steps && s.steps.length ? stepTable(s.steps) : el('div', { class: 'hint' }, 'No step was completed.')))
    const last =!st.running && s && s.phase === 'done' ? s : null
    if (last) results.append(el('div', { class: 'card', style: 'margin:0 0 14px;max-width:none' }, el('h2', {}, 'Last result'), el('div', {}, last.conclusion || ''), last.steps && last.steps.length ? stepTable(last.steps) : null))
    if (st.history.length) results.append(el('h2', { style: 'margin-top:18px' }, 'Earlier runs'), ...st.history.slice(0, 5).map(h => el('details', { class: 'adv', style: 'margin:6px 0' }, el('summary', {}, fmtTime(h.at) + ' - ' + (h.steps.length ? 'up to ' + h.steps[h.steps.length - 1].streams + ' streams' : 'did not run')),
      el('div', { class: 'hint', style: 'margin:6px 0' }, h.conclusion || ''), h.steps.length ? stepTable(h.steps) : null)))
  }

  const start = async () => {
    err.textContent = ''
    try {
      await oapi('/captest/start', 'POST', { streamsMax: +maxS.value, step: +step.value, stepSec: +stepSec.value, srtReaders: +srt.value, rtspReaders: +rtsp.value, whepReaders: +whep.value, cpuStopPct: +cpuStop.value, allowLive: allowLive.checked, ack: ack.checked })
      flash(err, 'Requested. It starts within a few seconds.', true); draw()
    } catch (e) { flash(err, e.message) }
  }
  const lab = (t, input) => el('label', { style: 'color:var(--text);flex-direction:column;gap:3px' }, el('span', { class: 'hint', style: 'margin:0' }, t), input)
  box.replaceChildren(
    el('div', { class: 'card', style: 'max-width:none;margin:0 0 14px' }, el('h2', {}, 'Capacity test'),
      el('div', { class: 'hint', style: 'margin:0' }, 'Finds how many 10 Mbps streams this server carries. It publishes synthetic streams to the relay from the server itself, reads each back like a decoder PC, through mediamtx, and as real WebRTC viewers (the same protocol a browser uses), and ramps up until something strains. It measures real CPU, memory, network and which process is busiest. It does not use your internet connection, and stops by itself on strain.'),
      el('div', { class: 'row', style: 'flex-wrap:wrap;align-items:flex-end;gap:14px' }, lab('Up to streams', maxS), lab('Add per step', step), lab('Seconds per step', stepSec), lab('Decoder readers / stream', srt), lab('mediamtx readers / stream', rtsp), lab('WebRTC viewers / stream', whep), lab('Stop above CPU %', cpuStop)),
      el('label', { class: 'check', style: 'flex-direction:row;gap:8px;color:var(--text)' }, allowLive, el('span', {}, 'Run even if live streams are on air (they may suffer; the test stops if one is affected)')),
      el('label', { class: 'check', style: 'flex-direction:row;gap:8px;color:var(--text)' }, ack, el('span', {}, 'I understand this loads the live server for several minutes')),
      el('div', { class: 'row' }, el('button', { class: 'b pri', onclick: start }, 'Start the test'), err)),
    live, results)
  await draw()
  capTimer = setInterval(() => { if (adminSub === 'capacity' && tab === 'admin' && !document.hidden) draw().catch(() => {}) }, 2000)
}

// Comms is its own section. It needs the same owner access as Admin (an Admin account has it already).
async function commsPage() {
  const content = el('div')
  $app.replaceChildren(...shell(content))
  try { owner = await oapi('/status') } catch (e) { return }
  if (!owner.unlocked) return content.replaceChildren(lockCard(refresh))
  try { await commsSection(content) } catch (e) { if (e.message !== 'locked' && e.message !== 'signed out') content.replaceChildren(el('div', { class: 'err' }, e.message)) }
}
function remotePage() {
  $app.replaceChildren(...shell(el('div', { class: 'card', style: 'max-width:620px;margin:0' }, el('h2', {}, 'Remote access'),
    el('div', { class: 'hint' }, 'Reserved for remote access features. Nothing is here yet.'))))
}
// Used when the owner area locks while one of its pages is open.
const ownerAreaRender = () => tab === 'admin' ? adminRender() : refresh()
async function refresh() {
  if (tab === 'admin') { $app.replaceChildren(...shell(el('div'))); return adminRender() }
  if (tab === 'comms') return commsPage()
  if (tab === 'remote') return remotePage()
  try {
    const [s, l, d] = await Promise.all([api('/streams'), api('/links'), tab === 'decoders' ? api('/decoders').catch(() => ({ decoders: [] })) : Promise.resolve({ decoders })])
    streams = s.streams; links = l.links; decoders = d.decoders
  } catch (e) { if (e.message === 'signed out') return }
  if (document.querySelector('.modal') && tab !== 'streams') return
  if (document.activeElement && document.activeElement.tagName === 'SELECT') return   // do not close an open dropdown
  $app.replaceChildren(...shell(tab === 'streams' ? streamsView() : tab === 'links' ? linksView() : decodersView()))
}
function start() { refresh(); clearInterval(timer); clearInterval(thumbTimer); thumbTimer = setInterval(fetchThumbs, 4000); setTimeout(fetchThumbs, 600); timer = setInterval(() => { if (!document.hidden && !document.querySelector('.modal') && isVideo(tab)) refresh() }, 2500) }
api('/me').then(m => { publicBase = m.publicBase || ''; me = m; start() }).catch(() => showLogin())
</script></body></html>
