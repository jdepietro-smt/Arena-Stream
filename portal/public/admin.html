<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena Portal</title>
<style>
:root{--bg:#0d0f13;--panel:#161a21;--edge:#2a303a;--text:#e6e9ee;--mut:#8b93a0;--acc:#ffb938;--ok:#34d058;--bad:#ff5b50}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--edge)}
h1{font-size:15px;letter-spacing:.14em;margin:0;font-weight:600;text-transform:uppercase}
nav{display:flex;gap:6px;margin-left:12px}nav button{background:none;border:1px solid var(--edge);color:var(--mut);padding:6px 14px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);border-color:var(--acc);color:#1a1205;font-weight:600}
.sp{flex:1}main{padding:20px;max-width:1100px;margin:0 auto;overflow-x:auto}table{min-width:620px}header{flex-wrap:wrap}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--edge);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--edge);vertical-align:middle}th{color:var(--mut);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
button.b,select,input{background:#1d222b;border:1px solid var(--edge);color:var(--text);border-radius:6px;padding:6px 12px;font:inherit}
button.b{cursor:pointer}button.b:hover{border-color:var(--acc)}button.b.pri{background:var(--acc);border-color:var(--acc);color:#1a1205;font-weight:600}
button.b:disabled{opacity:.45;cursor:default}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#232832;color:var(--mut)}
.chip.ok{background:rgba(52,208,88,.15);color:var(--ok)}.chip.bad{background:rgba(255,91,80,.15);color:var(--bad)}.chip.warn{background:rgba(255,185,56,.15);color:var(--acc)}
.empty{color:var(--mut);padding:24px;text-align:center}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:20px;max-width:340px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:5}
.modal .card{margin:0;max-width:440px;width:92vw}label{display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.url{flex:1;font-family:Consolas,monospace;font-size:12px}
.thumb{width:128px;height:72px;object-fit:cover;background:#0b0d10;border:1px solid var(--edge);border-radius:4px;display:block;cursor:pointer}
.nothumb{width:128px;height:72px;border:1px dashed var(--edge);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;cursor:pointer}
.live video{width:100%;aspect-ratio:16/9;background:#000;border-radius:6px}.live{max-width:760px!important;width:94vw!important}
.err{color:var(--bad);font-size:13px;min-height:1.2em}.hint{color:var(--mut);font-size:12px}h2{margin:0 0 10px;font-size:13px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;font-weight:600}
</style></head><body>
<div id="app"></div>
<script>
const $app = document.getElementById('app')
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v)
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)))
  return n
}
async function api(path, method = 'GET', body) {
  const r = await fetch('/portal/api' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
  const j = await r.json().catch(() => ({}))
  if (r.status === 401 && path !== '/login') { showLogin(); throw new Error('signed out') }
  if (!r.ok) throw new Error(j.error || r.statusText)
  return j
}
const fmtTime = t => t ? new Date(t).toLocaleString() : 'never'
let publicBase = ''
const linkUrl = id => (publicBase || location.origin) + '/w/' + id
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text) } catch { const t = el('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove() }
  const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => (btn.textContent = o), 1200)
}

let thumbTimer = null
let tab = 'streams', timer = null, streams = [], links = [], decoders = []

function showLogin() {
  clearInterval(timer); clearInterval(thumbTimer); clearInterval(ownerTimer); clearInterval(healthTimer); tab = 'streams'
  const err = el('div', { class: 'err' })
  const pw = el('input', { type: 'password', placeholder: 'Password', autofocus: true })
  const go = async () => { try { await api('/login', 'POST', { password: pw.value }); publicBase = (await api('/me')).publicBase || ''; start() } catch (e) { err.textContent = e.message } }
  pw.addEventListener('keydown', e => e.key === 'Enter' && go())
  $app.replaceChildren(el('div', { class: 'card' }, el('h1', {}, 'Arena Portal'), pw, el('button', { class: 'b pri', onclick: go }, 'Sign in'), err))
  pw.focus()
}

function shell(content) {
  const tabs = [['streams', 'Streams'], ['links', 'Web links'], ['decoders', 'Decoders'], ['admin', 'Admin']]
  return [
    el('header', {}, el('h1', {}, 'Arena Portal'),
      el('nav', {}, tabs.map(([k, t]) => el('button', { class: tab === k ? 'on' : '', onclick: () => { tab = k; clearInterval(ownerTimer); clearInterval(healthTimer); refresh() } }, t))),
      el('div', { class: 'sp' }),
      el('button', { class: 'b', onclick: async () => { await api('/logout', 'POST'); showLogin() } }, 'Sign out')),
    el('main', {}, content),
  ]
}

// Thumbnails: a picture per stream, fetched every few seconds while this page is open (the server only
// runs the picture worker while it is asked). Kept as object URLs so a redraw does not reload them.
const thumbCache = {}
function thumbEl(s) {
  const url = thumbCache[s.id]
  const open = () => liveDialog(s)
  if (!s.canShare || !s.browserOk) return el('div', { class: 'hint' }, '-')
  return url ? el('img', { class: 'thumb', src: url, 'data-sid': s.id, title: 'Click for live video', onclick: open })
             : el('div', { class: 'nothumb', 'data-sid': s.id, title: 'Click for live video', onclick: open }, 'waiting...')
}
async function fetchThumbs() {
  if (document.hidden || document.querySelector('.modal') || tab === 'links') return
  let changed = false
  await Promise.all(streams.filter(s => s.canShare && s.browserOk).map(async s => {
    try {
      const r = await fetch('/portal/api/thumb/' + encodeURIComponent(s.id))
      if (r.status !== 200) return
      const u = URL.createObjectURL(await r.blob())
      if (thumbCache[s.id]) URL.revokeObjectURL(thumbCache[s.id])
      thumbCache[s.id] = u; changed = true
    } catch (e) { /* try again next round */ }
  }))
  if (changed) for (const n of document.querySelectorAll('.nothumb')) { const s = streams.find(x => x.id === n.dataset.sid); if (s && thumbCache[s.id]) n.replaceWith(thumbEl(s)) }
  if (changed) for (const i of document.querySelectorAll('img.thumb')) if (thumbCache[i.dataset.sid] && i.src !== thumbCache[i.dataset.sid]) i.src = thumbCache[i.dataset.sid]
}

async function playWhep(base, video, say) {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] })
  let session = null, closed = false
  pc.addTransceiver('video', { direction: 'recvonly' }); pc.addTransceiver('audio', { direction: 'recvonly' })
  pc.ontrack = e => { video.srcObject = e.streams[0] }
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'connected') say(''); if (pc.connectionState === 'failed' && !closed) say('Connection lost') }
  try {
    await pc.setLocalDescription(await pc.createOffer())
    await new Promise(r => { if (pc.iceGatheringState === 'complete') return r(); pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r(); setTimeout(r, 2500) })
    const r = await fetch(base, { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp })
    if (r.status !== 201) throw new Error((await r.json().catch(() => ({}))).error || 'not available')
    session = r.headers.get('Location')
    await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() })
  } catch (e) { say(e.message) }
  return () => { closed = true; if (session) fetch(session, { method: 'DELETE' }).catch(() => {}); try { pc.close() } catch (e) { /* closed */ } }
}

function liveDialog(s) {
  const video = el('video', { autoplay: true, playsinline: true, muted: true, controls: true })
  video.muted = true
  const msg = el('div', { class: 'hint' }, 'Connecting...')
  let stop = () => {}
  const close = () => { stop(); dlg.remove() }
  const dlg = el('div', { class: 'modal', onclick: e => e.target === dlg && close() }, el('div', { class: 'card live' },
    el('h2', {}, 'Live: ' + s.name + '  ' + (s.format || '')), video, msg,
    el('div', { class: 'row' }, el('button', { class: 'b', onclick: close }, 'Close'), el('span', { class: 'hint' }, 'Sends the full stream to this browser; close it when you are done.'))))
  document.body.append(dlg)
  playWhep('/portal/api/whep/' + encodeURIComponent(s.id), video, t => { msg.textContent = t })
    .then(f => { if (!dlg.isConnected) f(); else stop = f })
}

function streamsView() {
  if (!streams.length) return el('div', { class: 'empty' }, 'No encoders are on air.')
  return el('table', {}, el('thead', {}, el('tr', {}, ['', 'Stream', 'Format', 'Codec', 'Bitrate', 'Web viewers', 'Links', ''].map(h => el('th', {}, h)))),
    el('tbody', {}, streams.map(s => el('tr', {},
      el('td', {}, thumbEl(s)), el('td', {}, s.name), el('td', {}, s.format || '-'), el('td', {}, s.codec || '-'),
      el('td', {}, s.kbps ? (s.kbps / 1000).toFixed(1) + ' Mbps' : '-'),
      el('td', {}, String(s.webViewers)), el('td', {}, String(s.links)),
      el('td', {}, !s.canShare ? el('span', { class: 'chip warn', title: 'Turn on "Internet viewers" for this stream in the Arena Link app' }, 'Not on relay')
        : !s.browserOk ? el('span', { class: 'chip warn', title: 'Browsers cannot play H.265. Use H.264 in the encoder.' }, 'H.265: no browser')
        : el('button', { class: 'b pri', onclick: () => newLinkDialog(s.name) }, 'Create web link'))))))
}

function linksView() {
  if (!links.length) return el('div', { class: 'empty' }, 'No links yet. Create one from the Streams tab.')
  return el('table', {}, el('thead', {}, el('tr', {}, ['Link', 'Stream', 'Status', 'Expires', 'Views', ''].map(h => el('th', {}, h)))),
    el('tbody', {}, links.map(l => {
      const cls = l.state === 'active' ? 'ok' : 'bad'
      return el('tr', {},
        el('td', {}, l.label || '(no label)', l.hasPassword ? el('span', { class: 'hint' }, '  password') : null),
        el('td', {}, l.stream), el('td', {}, el('span', { class: 'chip ' + cls }, l.state)), el('td', {}, fmtTime(l.expiresAt)), el('td', {}, String(l.views)),
        el('td', {}, l.state === 'active' ? el('div', { class: 'row' },
          el('button', { class: 'b', onclick: e => copy(linkUrl(l.id), e.target) }, 'Copy link'),
          el('button', { class: 'b', onclick: async () => { if (confirm('Revoke this link? Anyone using it is cut off.')) { await api('/links/' + l.id, 'DELETE'); refresh() } } }, 'Revoke')) : null))
    })))
}

const dChoice = {}
function decodersView() {
  if (!decoders.length) return el('div', { class: 'empty' }, 'No decoders are reporting. Open the Arena Link app on a decoder PC (update it to this version first).')
  const live = streams.map(s => s.name)
  return el('table', {}, el('thead', {}, el('tr', {}, ['Decoder', 'PC', 'Status', 'Playing', '', 'Play this stream', ''].map(h => el('th', {}, h)))),
    el('tbody', {}, decoders.map(d => {
      const sel = el('select', {}, el('option', { value: '' }, 'Disconnect'),
        [...new Set([...live, d.stream].filter(Boolean))].map(n => el('option', { value: n, selected: (dChoice[d.id] ?? d.stream) === n }, n)))
      sel.addEventListener('change', () => { dChoice[d.id] = sel.value })
      if (dChoice[d.id] === undefined && !d.stream) sel.value = ''
      const pending = d.want && d.want.stream !== d.stream
      return el('tr', {},
        el('td', {}, d.name), el('td', {}, d.host || '-'),
        el('td', {}, el('span', { class: 'chip ' + (d.state === 'live' ? 'ok' : '') }, d.state || '-')),
        el('td', {}, d.stream || '-'),
        el('td', {}, (() => { const st = streams.find(x => x.name === d.stream); return st ? thumbEl(st) : el('div', { class: 'hint' }, '-') })()),
        el('td', {}, sel),
        el('td', {}, el('div', { class: 'row' }, el('button', { class: 'b pri', onclick: async () => { await api('/decoders/' + encodeURIComponent(d.id) + '/want', 'POST', { stream: sel.value }); delete dChoice[d.id]; refresh() } }, 'Apply'),
          pending ? el('span', { class: 'chip warn' }, 'waiting for decoder') : null)))
    })))
}

function newLinkDialog(stream) {
  const label = el('input', { type: 'text', placeholder: 'For example: Client preview' })
  const exp = el('select', {}, [['60', '1 hour'], ['240', '4 hours'], ['1440', '1 day'], ['10080', '7 days'], ['43200', '30 days'], ['0', 'No expiry']].map(([v, t], i) => el('option', { value: v, selected: i === 2 }, t)))
  const pw = el('input', { type: 'text', placeholder: 'Optional password', autocomplete: 'off' })
  const err = el('div', { class: 'err' })
  const out = el('div')
  const close = () => dlg.remove()
  const make = async () => {
    err.textContent = ''
    try {
      const { link } = await api('/links', 'POST', { stream, label: label.value, expiresInMin: Number(exp.value), password: pw.value })
      const url = el('input', { type: 'text', class: 'url', readonly: true, value: linkUrl(link.id) })
      const cb = el('button', { class: 'b pri', onclick: e => copy(url.value, e.target) }, 'Copy')
      out.replaceChildren(el('div', { class: 'row' }, url, cb), el('div', { class: 'hint' }, 'Send this to the viewer. It works in any browser.'))
      refresh()
    } catch (e) { err.textContent = e.message }
  }
  const dlg = el('div', { class: 'modal', onclick: e => e.target === dlg && close() }, el('div', { class: 'card' },
    el('h2', {}, 'New web link: ' + stream),
    el('label', {}, 'Label', label), el('label', {}, 'Expires', exp), el('label', {}, 'Password', pw), err, out,
    el('div', { class: 'row' }, el('button', { class: 'b pri', onclick: make }, 'Create link'), el('button', { class: 'b', onclick: close }, 'Close'))))
  document.body.append(dlg)
  label.focus()
}

// ── Admin (owner-only) ─────────────────────────────────────────────────────────
// Needs the owner password on top of the normal login; it locks again after 15 idle minutes.
let owner = { configured: true, unlocked: false, remainingSec: 0 }, adminSub = 'account', ownerTimer = null, healthTimer = null
const SUBS = [['account', 'Account and security'], ['settings', 'Settings'], ['health', 'Server health'], ['activity', 'Activity and links']]

async function oapi(path, method = 'GET', body) {
  const r = await fetch('/portal/api/owner' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
  const j = await r.json().catch(() => ({}))
  if (r.status === 401 && path !== '/login') { showLogin(); throw new Error('signed out') }
  if (r.status === 403 && j.locked) { owner.unlocked = false; adminRender(); throw new Error('locked') }
  if (!r.ok) throw new Error(j.error || r.statusText)
  return j
}
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
const bytes = n => n >= 1e12 ? (n / 1e12).toFixed(1) + ' TB' : n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : (n / 1e6).toFixed(0) + ' MB'
const fmtAgo = s => s >= 86400 ? Math.floor(s / 86400) + ' d ' + Math.floor(s % 86400 / 3600) + ' h' : s >= 3600 ? Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min' : Math.floor(s / 60) + ' min'

function msgBox() { return el('div', { class: 'err' }) }
function flash(box, text, good) { box.textContent = text; box.style.color = good ? 'var(--ok)' : 'var(--bad)' }

async function adminRender() {
  clearInterval(ownerTimer); clearInterval(healthTimer)
  try { owner = await oapi('/status') } catch (e) { if (e.message === 'signed out') return }
  const body = $app.querySelector('main')
  if (!body) return $app.replaceChildren(...shell(el('div')))
  if (!owner.unlocked) return body.replaceChildren(lockCard())
  const content = el('div')
  body.replaceChildren(
    el('div', { class: 'row', style: 'margin-bottom:14px;flex-wrap:wrap' },
      SUBS.map(([k, t]) => el('button', { class: 'b' + (adminSub === k ? ' pri' : ''), onclick: () => { adminSub = k; adminRender() } }, t)),
      el('div', { class: 'sp' }),
      el('span', { class: 'hint', id: 'ownerLeft' }, 'Owner unlocked, locks in ' + mmss(owner.remainingSec)),
      el('button', { class: 'b', onclick: async () => { await oapi('/logout', 'POST'); adminRender() } }, 'Lock now')),
    content)
  let left = owner.remainingSec
  ownerTimer = setInterval(() => { left = Math.max(0, left - 1); const n = document.getElementById('ownerLeft'); if (n) n.textContent = 'Owner unlocked, locks in ' + mmss(left); if (left === 0) adminRender() }, 1000)
  try {
    if (adminSub === 'account') await accountSection(content)
    else if (adminSub === 'settings') await settingsSection(content)
    else if (adminSub === 'health') await healthSection(content)
    else await activitySection(content)
  } catch (e) { if (e.message !== 'locked' && e.message !== 'signed out') content.replaceChildren(el('div', { class: 'err' }, e.message)) }
}

function lockCard() {
  const err = msgBox()
  const pw = el('input', { type: 'password', placeholder: 'Owner password', autocomplete: 'off' })
  const go = async () => { try { await oapi('/login', 'POST', { password: pw.value }); adminRender() } catch (e) { flash(err, e.message) } }
  pw.addEventListener('keydown', e => e.key === 'Enter' && go())
  setTimeout(() => pw.focus(), 50)
  return el('div', { class: 'card', style: 'margin:6vh auto' }, el('h2', {}, 'Owner area'),
    el('div', { class: 'hint' }, owner.configured ? 'Settings, passwords, server health and the activity log need the owner password. It locks again after 15 minutes.' : 'No owner password is set yet. See the portal README to set one.'),
    pw, el('button', { class: 'b pri', onclick: go, disabled: !owner.configured }, 'Unlock'), err)
}

async function accountSection(box) {
  const mkForm = (which, title, hint) => {
    const cur = el('input', { type: 'password', placeholder: 'Current owner password', autocomplete: 'off' })
    const n1 = el('input', { type: 'password', placeholder: 'New password (10+ characters)', autocomplete: 'new-password' })
    const n2 = el('input', { type: 'password', placeholder: 'New password again', autocomplete: 'new-password' })
    const m = msgBox()
    const go = async () => {
      if (n1.value !== n2.value) return flash(m, 'The two new passwords differ')
      try { await oapi('/password', 'POST', { which, current: cur.value, next: n1.value }); showLogin() } catch (e) { flash(m, e.message) }
    }
    return el('div', { class: 'card', style: 'max-width:420px;margin:0' }, el('h2', {}, title), el('div', { class: 'hint' }, hint), cur, n1, n2, el('button', { class: 'b pri', onclick: go }, 'Change password'), m)
  }
  const sm = msgBox()
  const [act] = await Promise.all([oapi('/activity?limit=300')])
  const rows = act.entries.filter(e => e.action === 'login' || e.action === 'login.fail' || e.action.startsWith('owner.login') || e.action.startsWith('account.')).slice(0, 25)
  box.replaceChildren(
    el('div', { class: 'row', style: 'align-items:flex-start;flex-wrap:wrap;gap:16px' },
      mkForm('admin', 'Portal password', 'The everyday login. Changing it signs everyone out, this browser included.'),
      mkForm('owner', 'Owner password', 'Protects this Admin area. Changing it signs everyone out.'),
      el('div', { class: 'card', style: 'max-width:420px;margin:0' }, el('h2', {}, 'Sessions'), el('div', { class: 'hint' }, 'Signs out every browser that is logged in to the portal, including this one.'),
        el('button', { class: 'b', onclick: async () => { if (confirm('Sign out everywhere?')) { await oapi('/signout-all', 'POST'); showLogin() } } }, 'Sign out everywhere'), sm)),
    el('h2', { style: 'margin-top:22px' }, 'Recent sign-ins and account changes'),
    rows.length ? el('table', {}, el('thead', {}, el('tr', {}, ['When', 'Event', 'From', 'Detail'].map(h => el('th', {}, h)))),
      el('tbody', {}, rows.map(e => el('tr', {}, el('td', {}, fmtTime(e.at)), el('td', {}, el('span', { class: 'chip ' + (e.action.includes('fail') ? 'bad' : 'ok') }, e.action)), el('td', {}, e.ip || '-'), el('td', {}, e.detail || ''))))) : el('div', { class: 'empty' }, 'Nothing yet.'))
}

const SETTING_TEXT = {
  publicBase: ['Link address', 'What share links start with, for example https://stream.example.com. Empty uses the installed default.'],
  relayLatencyMs: ['Web viewer relay delay (ms)', '0 uses the installed default. Higher survives a lossy relay link; lower cuts delay.'],
  maxPreviews: ['Live previews at once', 'Each sends the full stream to your browser.'],
  thumbnailsEnabled: ['Thumbnails', 'Pictures on the Streams and Decoders tabs. Off stops the picture workers on the server.'],
  thumbEverySec: ['Thumbnail refresh (seconds)', 'Seconds between pictures.'],
  defaultLinkExpiryMin: ['Default link expiry (minutes)', 'Used when a link is created without choosing one. 0 means no expiry.'],
  requireLinkPassword: ['Require a password on every link', 'The Create link form refuses a link without one.'],
}
async function settingsSection(box) {
  const { settings, installed } = await oapi('/settings')
  const fields = {}
  const rows = Object.keys(SETTING_TEXT).map(k => {
    const [label, hint] = SETTING_TEXT[k]
    const v = settings[k]
    const input = typeof v === 'boolean' ? el('input', { type: 'checkbox', checked: v }) : el('input', { type: 'text', value: String(v) })
    fields[k] = input
    return el('label', { class: typeof v === 'boolean' ? 'check' : '', style: 'flex-direction:' + (typeof v === 'boolean' ? 'row' : 'column') + ';gap:6px;color:var(--text)' },
      typeof v === 'boolean' ? [input, el('span', {}, label)] : [el('span', {}, label), input], el('span', { class: 'hint', style: 'margin:0' }, hint + (k === 'relayLatencyMs' ? ' Installed default: ' + installed.relayLatencyMs + ' ms.' : '')))
  })
  const m = msgBox()
  const save = async () => {
    const patch = {}
    for (const [k, input] of Object.entries(fields)) patch[k] = input.type === 'checkbox' ? input.checked : input.value
    try {
      const r = await oapi('/settings', 'POST', { settings: patch })
      const n = Object.keys(r.changed).length
      flash(m, n ? 'Saved ' + n + ' change' + (n > 1 ? 's' : '') + '.' : 'Nothing changed.', true)
      publicBase = r.settings.publicBase || ''
    } catch (e) { flash(m, e.message) }
  }
  box.replaceChildren(el('div', { class: 'card', style: 'max-width:560px;margin:0;gap:14px' }, el('h2', {}, 'Portal settings'), rows, el('div', { class: 'row' }, el('button', { class: 'b pri', onclick: save }, 'Save'), m)))
}

function bar(used, total) {
  const pct = total ? Math.round(used / total * 100) : 0
  return el('div', { style: 'height:8px;background:#232832;border-radius:4px;overflow:hidden;min-width:120px' }, el('div', { style: 'height:100%;width:' + pct + '%;background:' + (pct > 90 ? 'var(--bad)' : pct > 75 ? 'var(--acc)' : 'var(--ok)') }))
}
async function healthSection(box) {
  const draw = async () => {
    const h = await oapi('/health')
    const warn = n => n === 'arena-lowlat' || n === 'mediamtx' || n === 'arena-link-directory' || n === 'nginx'
    box.replaceChildren(
      el('h2', {}, 'Services'),
      el('table', {}, el('thead', {}, el('tr', {}, ['Service', 'State', 'Running since', ''].map(x => el('th', {}, x)))),
        el('tbody', {}, h.services.map(s => el('tr', {}, el('td', {}, s.label, el('span', { class: 'hint' }, '  ' + s.name)),
          el('td', {}, el('span', { class: 'chip ' + (s.active ? 'ok' : s.installed ? 'bad' : '') }, s.state)), el('td', {}, s.since || '-'),
          el('td', {}, s.installed ? el('button', { class: 'b', onclick: async e => {
            const extra = warn(s.name) ? '\n\nThis interrupts streams and viewers for a few seconds.' : ''
            if (!confirm('Restart ' + s.label + '?' + extra)) return
            e.target.disabled = true
            try { await oapi('/services/' + s.name + '/restart', 'POST'); e.target.textContent = 'Requested' } catch (err) { e.target.textContent = err.message }
            setTimeout(() => adminSub === 'health' && adminRender(), 4000)
          } }, 'Restart') : null))))),
      el('h2', { style: 'margin-top:22px' }, 'Server'),
      el('table', {}, el('tbody', {},
        el('tr', {}, el('td', {}, 'Load (1 / 5 / 15 min)'), el('td', {}, h.system.load.map(x => x.toFixed(2)).join(' / ') + '   on ' + h.system.cpus + ' CPU cores')),
        el('tr', {}, el('td', {}, 'Memory'), el('td', {}, el('div', { class: 'row' }, bar(h.system.memTotal - h.system.memFree, h.system.memTotal), bytes(h.system.memTotal - h.system.memFree) + ' of ' + bytes(h.system.memTotal)))),
        h.disks.map(d => el('tr', {}, el('td', {}, 'Disk ' + d.mount), el('td', {}, el('div', { class: 'row' }, bar(d.used, d.total), bytes(d.used) + ' of ' + bytes(d.total) + ' (' + bytes(d.free) + ' free)')))),
        el('tr', {}, el('td', {}, 'Server up for'), el('td', {}, fmtAgo(h.system.uptimeSec))))),
      el('h2', { style: 'margin-top:22px' }, 'Portal'),
      el('table', {}, el('tbody', {},
        el('tr', {}, el('td', {}, 'Directory'), el('td', {}, el('span', { class: 'chip ' + (h.app.directory ? 'ok' : 'bad') }, h.app.directory ? 'reachable' : 'not reachable'))),
        el('tr', {}, el('td', {}, 'mediamtx API'), el('td', {}, el('span', { class: 'chip ' + (h.app.mediamtx ? 'ok' : 'bad') }, h.app.mediamtx ? 'reachable' : 'not reachable'))),
        el('tr', {}, el('td', {}, 'Encoders on air'), el('td', {}, String(h.app.encoders))),
        el('tr', {}, el('td', {}, 'Web viewers now'), el('td', {}, String(h.app.webViewers))),
        el('tr', {}, el('td', {}, 'Thumbnail workers / live previews'), el('td', {}, h.app.thumbWorkers + ' / ' + h.app.previews)))))
  }
  await draw()
  healthTimer = setInterval(() => { if (adminSub === 'health' && tab === 'admin' && !document.hidden && !document.querySelector('.modal')) draw().catch(() => {}) }, 5000)
}

let actFilter = ''
async function activitySection(box) {
  const [act, ls] = await Promise.all([oapi('/activity?limit=200' + (actFilter ? '&action=' + actFilter : '')), oapi('/links')])
  const sel = el('select', { onchange: () => { actFilter = sel.value; adminRender() } }, [['', 'Everything'], ['login', 'Sign-ins'], ['owner', 'Owner'], ['link', 'Links'], ['decoder', 'Decoder control'], ['settings', 'Settings'], ['service', 'Restarts'], ['account', 'Account']].map(([v, t]) => el('option', { value: v, selected: v === actFilter }, t)))
  box.replaceChildren(
    el('h2', {}, 'All links'),
    ls.links.length ? el('table', {}, el('thead', {}, el('tr', {}, ['Link', 'Stream', 'Status', 'Created', 'Views', 'Viewers (IPs)', 'Last viewed'].map(h => el('th', {}, h)))),
      el('tbody', {}, ls.links.map(l => el('tr', {}, el('td', {}, l.label || '(no label)', el('span', { class: 'hint' }, '  ' + l.id)), el('td', {}, l.stream),
        el('td', {}, el('span', { class: 'chip ' + (l.state === 'active' ? 'ok' : 'bad') }, l.state)), el('td', {}, fmtTime(l.createdAt)), el('td', {}, String(l.views)), el('td', {}, String(l.uniqueViewers)), el('td', {}, l.lastView ? fmtTime(l.lastView) : '-'))))) : el('div', { class: 'empty' }, 'No links yet.'),
    el('div', { class: 'row', style: 'margin:22px 0 10px' }, el('h2', { style: 'margin:0' }, 'Activity'), sel),
    act.entries.length ? el('table', {}, el('thead', {}, el('tr', {}, ['When', 'Who', 'Event', 'Detail', 'From'].map(h => el('th', {}, h)))),
      el('tbody', {}, act.entries.map(e => el('tr', {}, el('td', {}, fmtTime(e.at)), el('td', {}, e.who), el('td', {}, el('span', { class: 'chip ' + (e.action.includes('fail') ? 'bad' : '') }, e.action)), el('td', {}, e.detail || ''), el('td', {}, e.ip || '-'))))) : el('div', { class: 'empty' }, 'Nothing recorded.'))
}

async function refresh() {
  if (tab === 'admin') { $app.replaceChildren(...shell(el('div'))); return adminRender() }
  try {
    const [s, l, d] = await Promise.all([api('/streams'), api('/links'), tab === 'decoders' ? api('/decoders').catch(() => ({ decoders: [] })) : Promise.resolve({ decoders })])
    streams = s.streams; links = l.links; decoders = d.decoders
  } catch (e) { if (e.message === 'signed out') return }
  if (document.querySelector('.modal') && tab !== 'streams') return
  if (document.activeElement && document.activeElement.tagName === 'SELECT') return   // do not close an open dropdown
  $app.replaceChildren(...shell(tab === 'streams' ? streamsView() : tab === 'links' ? linksView() : decodersView()))
}
function start() { refresh(); clearInterval(timer); clearInterval(thumbTimer); thumbTimer = setInterval(fetchThumbs, 4000); setTimeout(fetchThumbs, 600); timer = setInterval(() => { if (!document.hidden && !document.querySelector('.modal') && tab !== 'admin') refresh() }, 2500) }
api('/me').then(m => { publicBase = m.publicBase || ''; start() }).catch(() => showLogin())
</script></body></html>
