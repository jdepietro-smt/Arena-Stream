<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arena Comms Admin</title>
<style>
  /* Key-panel look shared with the intercom and gateway (see ui/comms-app/src/kp.css) */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#08090c; --lift:#181a20; --ok:#34d058; --danger:#ff3b30; --warn:#ffb020; --text:#e4e7ec; --muted:#7d8592;
    --font:'Inter','Segoe UI',system-ui,sans-serif; --label:'Bahnschrift','Segoe UI Semibold','Arial Narrow',system-ui,sans-serif;
    --mono:Consolas,'Lucida Console',monospace; --lcd:#ffb938; --lcd-rgb:255,185,56; --steel-hi:#1f2227; --steel-lo:#15171b; --edge:#30343b; --well:#0e1013; }
  body { font-family:var(--font); background:radial-gradient(ellipse at 50% 0%, #14161b 0%, var(--bg) 60%); color:var(--text); font-size:13px; -webkit-font-smoothing:antialiased; min-height:100vh; }
  button,input,select { font:inherit; color:inherit; }
  .lcd { font-family:var(--mono); color:var(--lcd); text-shadow:0 0 6px rgba(var(--lcd-rgb),.4); background:#070a06 repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
    border:1px solid #000; border-radius:5px; box-shadow:inset 0 0 0 1px #1b2118, inset 0 3px 10px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.05); }
  header { display:flex; align-items:center; gap:18px; padding:0 20px; height:52px; position:sticky; top:0; z-index:2;
    background:linear-gradient(180deg,var(--steel-hi),var(--steel-lo)); border-bottom:1px solid var(--edge); box-shadow:0 6px 18px rgba(0,0,0,.45); }
  .brand { font:700 12px var(--label); letter-spacing:.16em; } .brand b { color:var(--lcd); }
  nav { display:flex; gap:6px; flex:1; }
  nav button { background:none; border:0; padding:8px 14px 6px; border-radius:6px; color:var(--muted); cursor:pointer; font:700 11px var(--label); letter-spacing:.14em; text-transform:uppercase; }
  nav button:hover { color:#fff; }
  nav button.on { color:var(--lcd); background:#070a06; box-shadow:inset 0 2px 6px rgba(0,0,0,.8), inset 0 0 0 1px #1b2118; text-shadow:0 0 6px rgba(var(--lcd-rgb),.4); }
  main { max-width:1000px; margin:0 auto; padding:24px 20px 60px; }
  h2 { font:700 15px var(--label); letter-spacing:.12em; text-transform:uppercase; }
  .bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; }
  .sub { color:var(--muted); font-size:12px; margin-top:4px; }
  .btn { position:relative; display:inline-flex; align-items:center; gap:6px; padding:7px 14px 5px; cursor:pointer; user-select:none; font:700 11px var(--label); letter-spacing:.12em; text-transform:uppercase; color:#cfd3da;
    background:linear-gradient(#383c44,#262930); border:1px solid #4a505a; border-bottom:4px solid #0d0e11; border-radius:7px; box-shadow:inset 0 1px 0 rgba(255,255,255,.12); transition:transform .04s,border-bottom-width .04s; }
  .btn:hover:not(:disabled) { color:#fff; } .btn:active:not(:disabled) { transform:translateY(2px); border-bottom-width:2px; }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
  .btn.primary { color:#0a0a0a; border-color:color-mix(in srgb,var(--lcd) 60%,#444); background:linear-gradient(color-mix(in srgb,var(--lcd) 85%,#fff),var(--lcd)); box-shadow:0 0 14px -4px var(--lcd), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn.danger:hover:not(:disabled) { color:#ff8277; } .btn.sm { padding:4px 10px 2px; font-size:10px; }
  table { width:100%; border-collapse:separate; border-spacing:0; background:linear-gradient(180deg,#1b1d22,#15171b); border:1px solid var(--edge); border-radius:10px; overflow:hidden; box-shadow:inset 0 0 0 3px var(--well), 0 8px 22px rgba(0,0,0,.4); }
  th { text-align:left; font:700 10px var(--label); letter-spacing:.14em; text-transform:uppercase; color:#8c93a0; padding:11px 14px; border-bottom:1px solid #2a2e35; background:#101216; }
  td { padding:10px 14px; border-bottom:1px solid #22252b; vertical-align:middle; } tr:last-child td { border-bottom:0; }
  tr.row { cursor:pointer; } tr.row:hover td { background:#1d2026; }
  .chip { display:inline-block; padding:1px 8px; margin:1px 4px 1px 0; border-radius:3px; font:700 10px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--lcd); background:#070a06; border:1px solid #1b2118; text-shadow:0 0 5px rgba(var(--lcd-rgb),.35); }
  .chip.warn { color:#ffb020; } .chip.bad { color:#ff6b5c; } .chip.ok { color:#7cff7c; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#0f1d12; box-shadow:inset 0 0 2px #000; margin-right:8px; } .dot.on { background:#34d058; box-shadow:0 0 8px 2px rgba(52,208,88,.6); }
  .swatch { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:8px; box-shadow:0 0 8px -2px currentColor; }
  .muted { color:var(--muted); } .mono { font-family:var(--mono); font-size:12px; }
  .center { min-height:100vh; display:grid; place-items:center; }
  form.card { position:relative; width:360px; display:flex; flex-direction:column; gap:14px; padding:24px 22px; border-radius:14px; background:linear-gradient(180deg,var(--steel-hi),var(--steel-lo)); border:1px solid var(--edge); box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 0 4px var(--well), 0 14px 34px rgba(0,0,0,.55); }
  label { display:flex; flex-direction:column; gap:5px; font:700 10px var(--label); letter-spacing:.12em; text-transform:uppercase; color:#8c93a0; }
  label.check { flex-direction:row; align-items:center; gap:8px; text-transform:none; letter-spacing:0; font:13px var(--font); color:var(--text); }
  input[type=text],input[type=password],input[type=number],input:not([type]),select { background:#0b0d10; border:1px solid #2b2f36; border-radius:5px; padding:8px 10px; text-transform:none; letter-spacing:0; font:13px var(--font); box-shadow:inset 0 2px 5px rgba(0,0,0,.65); }
  input:focus,select:focus { outline:0; border-color:var(--lcd); box-shadow:inset 0 2px 5px rgba(0,0,0,.65), 0 0 0 1px rgba(var(--lcd-rgb),.35); }
  input[type=checkbox],input[type=range] { accent-color:var(--lcd); } select option { background:#0b0d10; }
  dialog { position:relative; color:var(--text); border-radius:14px; padding:22px; width:min(580px,94vw); margin:auto; background:linear-gradient(180deg,var(--steel-hi),var(--steel-lo)); border:1px solid var(--edge); box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 0 4px var(--well), 0 24px 60px rgba(0,0,0,.7); }
  dialog::backdrop { background:rgba(0,0,0,.65); }
  dialog form { display:flex; flex-direction:column; gap:14px; max-height:82vh; overflow:auto; padding:2px; }
  dialog h2 { padding:9px 14px; font-family:var(--mono); color:var(--lcd); text-shadow:0 0 6px rgba(var(--lcd-rgb),.4); background:#070a06; border:1px solid #000; border-radius:5px; box-shadow:inset 0 0 0 1px #1b2118, inset 0 3px 10px rgba(0,0,0,.85); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; } .actions .sp { flex:1; }
  .matrix { width:100%; box-shadow:none; background:none; border:0; } .matrix td,.matrix th { padding:6px 10px; background:none; } .matrix select { padding:4px 6px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#3b1219; color:#fecaca; border:1px solid var(--danger); padding:10px 16px; border-radius:8px; z-index:9; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .toast.ok { background:#10281a; color:#bbf7d0; border-color:var(--ok); }
  fieldset { border:1px solid #2b2f36; border-radius:8px; padding:10px 12px; } legend { font:700 10px var(--label); letter-spacing:.14em; text-transform:uppercase; color:#8c93a0; padding:0 6px; }
  .grid { display:flex; flex-wrap:wrap; gap:6px 16px; }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:#2b2f36; border-radius:5px; border:2px solid #0e1013; } ::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  // Works both at /admin and behind a proxy prefix such as /comms/admin.
  const BASE = location.pathname.replace(/\/?$/, '/')
const S = { token: sessionStorage.getItem('arena-comms-admin'), state: null, tab: 'users', timer: null }
const $app = document.getElementById('app')

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else if (k === 'class') el.className = v
    else if (v === true) el.setAttribute(k, '')
    else if (v !== false && v != null) el.setAttribute(k, v)
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)))
  return el
}

function toast(msg, ok) {
  const t = h('div', { class: 'toast' + (ok ? ' ok' : '') }, msg)
  document.body.append(t); setTimeout(() => t.remove(), 3500)
}

async function api(method, path, body) {
  const r = await fetch(BASE + 'api/' + path, {
    method, headers: { 'content-type': 'application/json', ...(S.token ? { authorization: 'Bearer ' + S.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  })
  const data = await r.json().catch(() => ({}))
  if (r.status === 401 && path !== 'login') { signOut(); throw new Error('Session expired — sign in again') }
  if (!r.ok) throw new Error(data.error || 'Request failed (' + r.status + ')')
  return data
}

const act = async (fn, okMsg) => {
  try { await fn(); if (okMsg) toast(okMsg, true); await refresh() } catch (e) { toast(e.message) }
}

function signOut() {
  S.token = null; sessionStorage.removeItem('arena-comms-admin'); clearInterval(S.timer); render()
}

async function refresh() {
  S.state = await api('GET', 'state')
  render()
}

// ── login ────────────────────────────────────────────────────────────────────
function login() {
  const u = h('input', { autofocus: true, autocomplete: 'username' }), p = h('input', { type: 'password', autocomplete: 'current-password' })
  const err = h('div', { class: 'muted' })
  return h('div', { class: 'center' }, h('form', { class: 'card', onsubmit: async e => {
    e.preventDefault()
    try {
      const r = await api('POST', 'login', { username: u.value, password: p.value })
      S.token = r.token; sessionStorage.setItem('arena-comms-admin', r.token)
      await refresh(); S.timer = setInterval(() => refresh().catch(() => {}), 5000)
    } catch (ex) { err.textContent = ex.message; err.style.color = 'var(--danger)' }
  } },
    h('div', { class: 'brand' }, 'ARENA ', h('b', {}, 'COMMS'), ' · ADMIN'),
    h('label', {}, 'Username', u), h('label', {}, 'Password', p), err,
    h('button', { class: 'btn primary' }, 'Sign in')))
}

// ── shared bits ──────────────────────────────────────────────────────────────
const chanName = id => S.state.channels.find(c => c.id === id)?.name ?? id
const groupName = id => S.state.groups.find(g => g.id === id)?.name ?? id
const onlineFor = userId => S.state.online.filter(o => o.userId === userId)

function modal(title, body, onSave, extra) {
  const dlg = h('dialog', {})
  const form = h('form', { method: 'dialog', onsubmit: async e => {
    e.preventDefault()
    try { await onSave(); dlg.close(); await refresh() } catch (ex) { toast(ex.message) }
  } }, h('h2', {}, title), body,
    h('div', { class: 'actions' }, extra || '', h('span', { class: 'sp' }),
      h('button', { type: 'button', class: 'btn', onclick: () => dlg.close() }, 'Cancel'),
      h('button', { class: 'btn primary' }, 'Save')))
  dlg.append(form); dlg.addEventListener('close', () => dlg.remove())
  document.body.append(dlg); dlg.showModal()
}

const confirmDelete = (what, fn) => h('button', { type: 'button', class: 'btn danger', onclick: () => { if (confirm('Delete ' + what + '?')) { document.querySelector('dialog')?.close(); act(fn, 'Deleted') } } }, 'Delete')

// ── users ────────────────────────────────────────────────────────────────────
function userDialog(u) {
  const st = S.state, isNew = !u; u = u || { groups: [], overrides: {}, admin: false, disabled: false }
  const f = {
    username: h('input', { value: u.username || '' }), name: h('input', { value: u.name || '' }), title: h('input', { value: u.title || '', placeholder: 'defaults to first group' }),
    password: h('input', { type: 'password', placeholder: isNew ? 'min. 8 characters' : 'leave blank to keep', autocomplete: 'new-password' }),
    admin: h('input', { type: 'checkbox', checked: !!u.admin }), disabled: h('input', { type: 'checkbox', checked: !!u.disabled }),
  }
  const groupBoxes = st.groups.map(g => [g, h('input', { type: 'checkbox', checked: u.groups.includes(g.id) })])
  const tri = (ch, key) => {
    const cur = u.overrides?.[ch]?.[key]
    return h('select', { 'data-ch': ch, 'data-key': key },
      h('option', { value: '' }, 'inherit'), h('option', { value: 'true', selected: cur === true }, 'allow'), h('option', { value: 'false', selected: cur === false }, 'deny'))
  }
  const anyMusic = st.channels.some(c => c.music || c.withMusic)
  const ov = h('table', { class: 'matrix' }, h('tr', {}, h('th', {}, 'Channel'), h('th', {}, 'Talk'), h('th', {}, 'Listen'), anyMusic && h('th', {}, '♪ Music')),
    st.channels.map(c => h('tr', {}, h('td', {}, h('span', { class: 'swatch', style: 'background:' + c.color }), c.name + (c.music || c.withMusic ? ' ♪' : '')), h('td', {}, tri(c.id, 'talk')), h('td', {}, tri(c.id, 'listen')),
      anyMusic && h('td', {}, c.music || c.withMusic ? tri(c.id, 'music') : ''))),
    anyMusic && h('caption', { class: 'muted' }, '♪ Music = may start the music on that channel (no Talk needed). Listen = hears it.'))
  modal(isNew ? 'Add user' : 'Edit ' + u.name, h('div', { style: 'display:flex;flex-direction:column;gap:14px' },
    h('div', { class: 'row2' }, h('label', {}, 'Username (login)', f.username), h('label', {}, 'Display name', f.name)),
    h('div', { class: 'row2' }, h('label', {}, 'Title', f.title), h('label', {}, 'Password', f.password)),
    h('fieldset', {}, h('legend', {}, 'Groups'), h('div', { class: 'grid' }, groupBoxes.map(([g, b]) => h('label', { class: 'check' }, b, g.name)), !st.groups.length && h('span', { class: 'muted' }, 'No groups yet'))),
    h('fieldset', {}, h('legend', {}, 'Per-user overrides (on top of groups)'), ov),
    h('div', { class: 'grid' }, h('label', { class: 'check' }, f.admin, 'Administrator'), h('label', { class: 'check' }, f.disabled, 'Disabled'))),
  async () => {
    const overrides = {}
    ov.querySelectorAll('select').forEach(s => { if (s.value) (overrides[s.dataset.ch] ??= {})[s.dataset.key] = s.value === 'true' })
    const body = { username: f.username.value, name: f.name.value || f.username.value, title: f.title.value, groups: groupBoxes.filter(([, b]) => b.checked).map(([g]) => g.id),
      overrides, admin: f.admin.checked, disabled: f.disabled.checked, password: f.password.value }
    if (isNew) await api('POST', 'users', body); else await api('PUT', 'users/' + u.id, body)
  }, isNew ? '' : confirmDelete('user ' + u.name, () => api('DELETE', 'users/' + u.id)))
}

function usersView() {
  const st = S.state
  return [h('div', { class: 'bar' }, h('div', {}, h('h2', {}, 'Users'), h('div', { class: 'sub' }, 'People who can sign in to the intercom. Permissions come from their groups.')),
      h('button', { class: 'btn primary', onclick: () => userDialog() }, 'Add user')),
    h('table', {}, h('tr', {}, ['', 'Name', 'Login', 'Groups', 'Flags'].map(x => h('th', {}, x))),
      st.users.map(u => h('tr', { class: 'row', onclick: () => userDialog(u) },
        h('td', {}, h('span', { class: 'dot' + (onlineFor(u.id).length ? ' on' : ''), title: onlineFor(u.id).length ? 'online' : 'offline' })),
        h('td', {}, u.name, u.title && h('span', { class: 'muted' }, ' · ' + u.title)), h('td', { class: 'mono' }, u.username),
        h('td', {}, u.groups.map(g => h('span', { class: 'chip' }, groupName(g))), !u.groups.length && h('span', { class: 'muted' }, 'none')),
        h('td', {}, u.admin && h('span', { class: 'chip warn' }, 'admin'), u.disabled && h('span', { class: 'chip bad' }, 'disabled'))))) ]
}

// ── groups ───────────────────────────────────────────────────────────────────
function groupDialog(g) {
  const st = S.state, isNew = !g; g = g || { name: '', selfJoin: false, grants: {} }
  const name = h('input', { value: g.name }), self = h('input', { type: 'checkbox', checked: !!g.selfJoin })
  const cell = (ch, key) => h('input', { type: 'checkbox', 'data-ch': ch, 'data-key': key, checked: !!g.grants[ch]?.[key] })
  const anyMusic = st.channels.some(c => c.music || c.withMusic)
  const m = h('table', { class: 'matrix' }, h('tr', {}, h('th', {}, 'Channel'), h('th', {}, 'Talk'), h('th', {}, 'Listen'), anyMusic && h('th', {}, '♪ Music')),
    st.channels.map(c => h('tr', {}, h('td', {}, h('span', { class: 'swatch', style: 'background:' + c.color }), c.name + (c.music || c.withMusic ? ' ♪' : '')), h('td', {}, cell(c.id, 'talk')), h('td', {}, cell(c.id, 'listen')),
      anyMusic && h('td', {}, c.music || c.withMusic ? cell(c.id, 'music') : ''))),
    anyMusic && h('caption', { class: 'muted' }, '♪ Music = may start the music on that channel (no Talk needed). Listen = hears it. On a music-only channel, Talk also lets someone start it.'))
  modal(isNew ? 'Add group' : 'Edit ' + g.name, h('div', { style: 'display:flex;flex-direction:column;gap:14px' },
    h('label', {}, 'Group name', name), h('fieldset', {}, h('legend', {}, 'Channel access'), m),
    h('label', { class: 'check' }, self, 'Self-join: offer this as a role in open (no-account) mode')),
  async () => {
    const grants = {}
    m.querySelectorAll('input').forEach(i => { (grants[i.dataset.ch] ??= {})[i.dataset.key] = i.checked })
    const body = { name: name.value, selfJoin: self.checked, grants }
    if (isNew) await api('POST', 'groups', body); else await api('PUT', 'groups/' + g.id, body)
  }, isNew ? '' : confirmDelete('group ' + g.name, () => api('DELETE', 'groups/' + g.id)))
}

function groupsView() {
  const st = S.state
  return [h('div', { class: 'bar' }, h('div', {}, h('h2', {}, 'Groups'), h('div', { class: 'sub' }, 'Each group grants talk and/or listen on channels. Add users to groups.')),
      h('button', { class: 'btn primary', onclick: () => groupDialog() }, 'Add group')),
    h('table', {}, h('tr', {}, ['Group', 'Channels', 'Members'].map(x => h('th', {}, x))),
      st.groups.map(g => h('tr', { class: 'row', onclick: () => groupDialog(g) },
        h('td', {}, g.name, g.selfJoin && h('span', { class: 'chip' }, 'self-join')),
        h('td', {}, Object.entries(g.grants).map(([c, v]) => h('span', { class: 'chip' }, chanName(c) + ' ' + (v.talk && v.listen ? '⇄' : v.talk ? 'talk' : 'listen')))),
        h('td', {}, st.users.filter(u => u.groups.includes(g.id)).length))))]
}

// ── channels ─────────────────────────────────────────────────────────────────
/**
 * Server player: plays the channel's saved stream URL on the server and sends it to everyone listening on the channel.
 * Nobody's computer or browser is involved. Only direct audio streams work, not YouTube or Spotify page links.
 */
function serverPlayerBox(c) {
  const status = h('div', { class: 'muted' })
  const play = h('button', { type: 'button', class: 'btn primary' }, '▶ Play on server')
  const stop = h('button', { type: 'button', class: 'btn' }, '■ Stop')
  const box = h('fieldset', {}, h('legend', {}, 'Server player'),
    h('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' }, play, stop, status))
  const show = st => {
    st = st || { state: 'idle' }
    const usable = S.state.serverPlayer && !!c.source
    play.disabled = !usable || st.state === 'starting' || st.state === 'playing'
    stop.disabled = !usable || st.state === 'idle'
    status.style.color = st.state === 'error' ? 'var(--danger)' : ''
    status.textContent = !S.state.serverPlayer ? 'Playing on the server needs the SFU media mode.'
      : !c.source ? (c.link ? "This channel has a web page link (YouTube, Spotify...), which the server can't play. Put a direct audio stream address in the box above and save."
        : 'Save a stream URL above to play it from the server.')
      : st.state === 'playing' ? '● Playing on the server and sent to the panels.'
      : st.state === 'starting' ? 'Starting...'
      : st.state === 'error' ? '✕ ' + st.error
      : 'Stopped. Plays the saved stream on the server and sends it to the panels.'
  }
  const call = async action => {
    try { show({ state: 'starting' }); show(await api('POST', 'channels/' + c.id + '/player', { action })) } catch (e) { show({ state: 'error', error: e.message }) }
  }
  play.onclick = () => call('start')
  stop.onclick = () => call('stop')
  show(S.state.players?.[c.id])
  const timer = setInterval(async () => {
    if (!box.isConnected) return clearInterval(timer)
    try { show((await api('GET', 'players')).players[c.id]) } catch { /* keep the last status */ }
  }, 2000)
  return box
}

function channelDialog(c) {
  const isNew = !c; c = c || { name: '', color: '#6366f1', ifb: false, music: false, withMusic: false }
  const f = { name: h('input', { value: c.name }), color: h('input', { type: 'color', value: c.color, style: 'height:34px;padding:2px' }),
    ifb: h('input', { type: 'checkbox', checked: !!c.ifb }), duck: h('input', { type: 'number', min: 0, max: 1, step: 0.01, value: c.duck ?? 0.15 }),
    music: h('input', { type: 'checkbox', checked: !!c.music }), withMusic: h('input', { type: 'checkbox', checked: !!c.withMusic }),
    source: h('input', { value: c.source || c.link || '', placeholder: 'https://example.com/live.mp3  or  https://www.youtube.com/watch?v=…  (optional)', spellcheck: 'false' }),
    duckMusic: h('input', { type: 'checkbox', checked: !c.noDuck }) }
  const sourceRow = h('label', {}, "Stream or player link: a radio station's direct MP3 / AAC / Ogg stream (plays when the sender presses START), or a YouTube / Spotify page link (the sender's key opens it and shares its audio)", f.source)
  const withMusicRow = h('label', { class: 'check' }, f.withMusic, '♪ Also play music on this channel: anyone given the Music permission here gets a link box and START on its key (no Talk needed); everyone listening hears the music here')
  const ifbRow = h('label', { class: 'check' }, f.ifb, 'IFB: duck the program feed (and any music) for listeners while someone talks here')
  const duckMusicRow = h('label', { class: 'check' }, f.duckMusic, 'Duck the music while someone talks on an IFB channel')
  const duckText = h('span', {})
  const duckLabel = h('label', {}, duckText, f.duck)
  // A music-only channel is one-way stereo music. A normal channel can also carry music. An IFB cannot.
  const sync = () => {
    const music = f.music.checked
    if (music) { f.ifb.checked = false; f.withMusic.checked = false }
    if (f.ifb.checked) f.withMusic.checked = false
    if (f.withMusic.checked) f.ifb.checked = false
    const anyMusic = music || f.withMusic.checked
    withMusicRow.style.display = music ? 'none' : ''
    f.withMusic.disabled = f.ifb.checked
    ifbRow.style.display = music ? 'none' : ''
    f.ifb.disabled = f.withMusic.checked
    sourceRow.style.display = anyMusic ? '' : 'none'
    duckMusicRow.style.display = anyMusic ? '' : 'none'
    f.duck.disabled = !(anyMusic ? f.duckMusic.checked : f.ifb.checked)
    duckText.textContent = anyMusic ? 'How low the music goes while an IFB channel is talking (0–1, lower is quieter)' : 'Duck level (0–1, lower is quieter)'
  }
  f.music.onchange = sync; f.withMusic.onchange = sync; f.ifb.onchange = sync; f.duckMusic.onchange = sync; sync()
  modal(isNew ? 'Add channel' : 'Edit ' + c.name, h('div', { style: 'display:flex;flex-direction:column;gap:14px' },
    h('div', { class: 'row2' }, h('label', {}, 'Name', f.name), h('label', {}, 'Colour', f.color)),
    withMusicRow,
    h('label', { class: 'check' }, f.music, '♪ Music-only channel: no talking, just music a player (e.g. the A1) sends; Music (or Talk) = may send it, Listen = hears it'),
    sourceRow, ifbRow, duckMusicRow, duckLabel, !isNew && (c.music || c.withMusic) && serverPlayerBox(c)),
  async () => {
    const music = f.music.checked, withMusic = !music && f.withMusic.checked, anyMusic = music || withMusic
    const body = { name: f.name.value, color: f.color.value, music, withMusic, source: anyMusic ? f.source.value.trim() : '', ifb: !anyMusic && f.ifb.checked,
      noDuck: anyMusic && !f.duckMusic.checked, duck: (anyMusic ? f.duckMusic.checked : f.ifb.checked) ? Number(f.duck.value) : undefined }
    if (isNew) await api('POST', 'channels', body); else await api('PUT', 'channels/' + c.id, body)
  }, isNew ? '' : confirmDelete('channel ' + c.name, () => api('DELETE', 'channels/' + c.id)))
}

/** Who can start a music channel: only people with Talk on it get the Start key. Warn when no group has it. */
function musicSenders(c) {
  const names = S.state.groups.filter(g => g.grants?.[c.id]?.music || (c.music && g.grants?.[c.id]?.talk)).map(g => g.name)
  return names.length
    ? h('span', { class: 'chip' }, 'can start it: ' + names.join(', '))
    : h('span', { class: 'chip bad', title: 'Edit a group and tick Music for this channel' }, 'nobody can start it yet: give a group Music')
}

function channelsView() {
  const ids = S.state.channels.map(c => c.id)
  const move = (i, d) => { const a = [...ids]; [a[i], a[i + d]] = [a[i + d], a[i]]; act(() => api('POST', 'channels/reorder', { ids: a })) }
  return [h('div', { class: 'bar' }, h('div', {}, h('h2', {}, 'Channels'), h('div', { class: 'sub' }, 'Order here is the order on everyone’s intercom (keys 1–9 follow it).')),
      h('button', { class: 'btn primary', onclick: () => channelDialog() }, 'Add channel')),
    h('table', {}, h('tr', {}, ['', 'Channel', 'ID', 'Type', ''].map(x => h('th', {}, x))),
      S.state.channels.map((c, i) => h('tr', { class: 'row', onclick: () => channelDialog(c) },
        h('td', {}, i + 1), h('td', {}, h('span', { class: 'swatch', style: 'background:' + c.color }), c.name), h('td', { class: 'mono' }, c.id),
        h('td', {}, c.music || c.withMusic ? [h('span', { class: 'chip' }, (c.music ? '♪ music' : '♪ + music') + (c.source ? ' · stream' : c.link ? ' · link' : '')), ' ', musicSenders(c)] : c.ifb ? h('span', { class: 'chip warn' }, 'IFB ' + (c.duck ?? 0.15)) : h('span', { class: 'muted' }, 'party line')),
        h('td', { onclick: e => e.stopPropagation() },
          h('button', { class: 'btn sm', disabled: i === 0, onclick: () => move(i, -1) }, '↑'), ' ',
          h('button', { class: 'btn sm', disabled: i === ids.length - 1, onclick: () => move(i, 1) }, '↓')))))]
}

// ── online ───────────────────────────────────────────────────────────────────
function onlineView() {
  const o = S.state.online
  return [h('div', { class: 'bar' }, h('div', {}, h('h2', {}, 'Online now'), h('div', { class: 'sub' }, o.length + ' connected'))),
    o.length ? h('table', {}, h('tr', {}, ['Name', 'Title', 'Type', ''].map(x => h('th', {}, x))),
      o.map(p => h('tr', {}, h('td', {}, h('span', { class: 'dot on' }), p.name), h('td', {}, p.title),
        h('td', {}, p.ephemeral ? h('span', { class: 'chip' }, 'guest') : h('span', { class: 'chip ok' }, 'account')),
        h('td', {}, h('button', { class: 'btn sm danger', onclick: () => confirm('Remove ' + p.name + ' from the intercom?') && act(() => api('POST', 'kick/' + p.id), 'Removed') }, 'Kick'))))) : h('div', { class: 'muted' }, 'Nobody is connected.')]
}

const TABS = { users: ['Users', usersView], groups: ['Groups', groupsView], channels: ['Channels', channelsView], online: ['Online', onlineView] }

function render() {
  if (document.querySelector('dialog[open]')) return // don't clobber an open editor during polling
  $app.replaceChildren()
  if (!S.token || !S.state) { $app.append(login()); return }
  $app.append(h('header', {}, h('div', { class: 'brand' }, 'ARENA ', h('b', {}, 'COMMS'), ' · ADMIN'),
    h('nav', {}, Object.entries(TABS).map(([k, [label]]) => h('button', { class: S.tab === k ? 'on' : '', onclick: () => { S.tab = k; render() } }, label, k === 'online' ? ' (' + S.state.online.length + ')' : ''))),
    h('button', { class: 'btn sm', onclick: () => { api('POST', 'logout').catch(() => {}); signOut() } }, 'Sign out')),
    h('main', {}, TABS[S.tab][1]()))
}

if (S.token) refresh().then(() => { S.timer = setInterval(() => refresh().catch(() => {}), 5000) }).catch(() => { S.token = null; render() })
else render()
</script>
</body>
</html>
